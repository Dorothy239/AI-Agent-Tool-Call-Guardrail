[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail"
version = "0.2.0"
description = "Fail-closed policy guardrail for AI agent tool calls"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["guardrail"]
package-dir = {guardrail = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
